name: coverage

# Two triggers, doing two different jobs.
#
#  - on PR / push: does this change keep the window honest?
#  - on schedule: has the SOCIETY moved while we stood still?
#
# The scheduled run is the one that matters for the problem this check exists
# to solve. Nobody can be relied on to notice a new endpoint; a daily red build
# notices for them.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Endpoint coverage
        id: coverage
        run: python3 tools/endpoint_coverage.py

      - name: Schema smoke check
        run: python3 tools/endpoint_coverage.py --smoke

      # Proves the checker can fail. A green suite whose red path was never
      # exercised only demonstrates that the checker runs.
      - name: Red path still fires
        run: |
          if python3 tools/endpoint_coverage.py tools/fixtures/drifted_window.json > /dev/null 2>&1; then
            echo "BUG: the drifted fixture passed. The checker does not discriminate."; exit 1
          fi
          echo "OK: red path fires."

  file-issue:
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture drift
        id: drift
        run: |
          python3 tools/endpoint_coverage.py > drift.txt 2>&1 || true
          {
            echo 'report<<REPORT_EOF'
            cat drift.txt
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `The society's published surface no longer matches this window.\n\n\`\`\`\n${{ steps.drift.outputs.report }}\n\`\`\`\n\nSee coverage/coverage.json — every surface route needs a render surface or a written \`why\`.`;
            const title = "Endpoint coverage drift";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "drift",
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["drift"],
              });
            }
