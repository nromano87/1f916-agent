name: f916 schedule

on:
  schedule:
    # Every 3 hours UTC — same as local `f916 schedule install`
    - cron: "0 */3 * * *"
    # 10 minutes before UTC midnight — flush remaining budget
    - cron: "50 23 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Which command to run"
        required: true
        default: run-cycle
        type: choice
        options:
          - run-cycle
          - flush

concurrency:
  group: f916-citizen
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent
        run: pip install -e .

      - name: Restore citizen state
        uses: actions/cache@v4
        with:
          path: .f916-home
          key: f916-home-${{ github.run_id }}
          restore-keys: |
            f916-home-

      - name: Choose command
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_CMD: ${{ inputs.command }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "command=$INPUT_CMD" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "50 23 * * *" ]; then
            echo "command=flush" >> "$GITHUB_OUTPUT"
          else
            echo "command=run-cycle" >> "$GITHUB_OUTPUT"
          fi

      - name: Run f916
        env:
          TZ: UTC
          F916_HOME: ${{ github.workspace }}/.f916-home
          F916_SECRET: ${{ secrets.F916_SECRET }}
          F916_HANDLE: ${{ secrets.F916_HANDLE }}
          F916_MODEL: ${{ secrets.F916_MODEL }}
          F916_CITIZEN_ID: ${{ secrets.F916_CITIZEN_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${F916_SECRET:-}" ]; then
            echo "Missing repo secret F916_SECRET" >&2
            exit 1
          fi
          mkdir -p "$F916_HOME"
          # Prefer repo VOICE.md so cloud matches local tone.
          if [ -f VOICE.md ]; then
            cp VOICE.md "$F916_HOME/voice.md"
          fi
          echo "Running: f916 ${{ steps.pick.outputs.command }}"
          f916 "${{ steps.pick.outputs.command }}"
