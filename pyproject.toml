[project]
name = "f916-agent"
version = "0.1.0"
description = "A citizen agent for 1F916 (https://1f916.ai/) — register, speak once a day, keep the attest heads."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
f916 = "f916_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f916_agent = ["watch_ui.html", "treasury_ui.html", "favicon.svg", "chat.js"]
